# Cluster topology: single node, multiple GPUs (data/model parallel across
# GPUs on one machine).
#
# torchrun automatically sets these environment variables for every launched
# process, so they do NOT need to be specified manually here: RANK, LOCAL_RANK,
# WORLD_SIZE, LOCAL_WORLD_SIZE, GROUP_RANK, ROLE_RANK, MASTER_ADDR, MASTER_PORT
# (when using the default c10d rendezvous with a single node).
# Fields below are the ones YOU must specify to launch torchrun correctly.

# Total number of physical machines (nodes) participating in training.
num_nodes: 1

# Number of processes to launch on this node — set this to the number of
# GPUs available on the machine (e.g. 8 for a standard 8-GPU node).
nproc_per_node: 8


